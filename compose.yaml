services:
  biometrics:
    build: ./services/biometrics
    restart: unless-stopped
    environment:
      BIOMETRIC_PROVIDER_TOKEN: ${BIOMETRIC_PROVIDER_TOKEN}
    ports:
      - "127.0.0.1:8100:8100"
  postgres:
    image: postgres:17-alpine
    container_name: churrascaria-ponto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: churrascaria_ponto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Belem
    ports:
      - "5432:5432"
    volumes:
      - churrascaria_ponto_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d churrascaria_ponto"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  churrascaria_ponto_data:
